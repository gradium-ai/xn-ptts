[package]
name = "ptts-wasm"
version.workspace = true
edition = "2024"
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[dependencies]
ptts = { workspace = true, features = ["hf"] }
xn = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
# `Model::generation_step` returns a promise: on WebGPU it awaits the GPU's readback.
wasm-bindgen-futures = "0.4"
serde_json = { workspace = true }
# Not `rand` / `rand_distr`: the noise source is `ptts::flow_lm::NormalRng` now. `getrandom`
# stays, because selecting its `wasm_js` backend is this crate's business, not the library's.
getrandom = { workspace = true, features = ["wasm_js"] }
# The `threads` build only: Web Workers for rayon, which xn's CPU pool then runs on.
rayon = { version = "1", optional = true }
wasm-bindgen-rayon = { version = "1.3", optional = true }

[package.metadata.wasm-pack.profile.profiling]
wasm-opt = false

[features]
default = []
webgpu = ["xn/webgpu"]
# Generation on several CPU threads. Needs a nightly toolchain with std rebuilt for atomics,
# and a page that is cross-origin isolated: see the `build-threads` target in the Makefile.
threads = ["dep:rayon", "dep:wasm-bindgen-rayon"]
