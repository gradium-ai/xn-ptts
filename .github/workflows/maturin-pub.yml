# Wheels for `pip install ptts` and `uvx ptts`, and the PyPI release on a `v*` tag.
#
# PyPI accepts the upload through a trusted publisher pinned to this repository *and to this
# file's name*. Renaming this file silently breaks releasing; change it on PyPI first.
#
# Close to `maturin generate-ci github -m ptts-pyo3/Cargo.toml`, but regenerating would undo
# five things:
#
#   - `ptts-pyo3` builds an abi3 extension (see the comment on its `pyo3` dependency), so a
#     platform needs one wheel and not one per interpreter. Hence no `--find-interpreter`,
#     no free-threaded wheels and no Python matrix: `python-version` only has to build it.
#     `sdist-fallback` compiles the sdist on the interpreters abi3 cannot serve instead.
#   - wheels build `--strip`. The release profile carries no debug info, but `--strip` keeps
#     it that way if it ever does: on Linux debug info lands inside the `.so`, and it once
#     pushed the published wheel to 41 MB against 3.9 MB elsewhere.
#   - every job deletes `.cargo/config.toml` first, and sets `RUSTFLAGS` itself. That file
#     pins `target-cpu=native`, which in a published wheel means "whatever CPU the runner
#     happened to have" -- a wheel that faults with SIGILL on someone's older machine.
#   - macOS builds with its fast paths on: `accelerate` everywhere, and `kai` and `metal` on
#     Apple silicon (Arm's KleidiAI kernels for q8, a no-op on chips without SME2; Metal for
#     f32 weights, which `device=None` then picks). The platform most likely to be someone's
#     first impression was otherwise getting the slowest build we ship. A check fails the job
#     if the KleidiAI kernels quietly did not compile.
#   - the `test-wheel` step, which installs the wheel the job just built and runs pytest.
#
# `xn` picks its quantized SIMD kernels with `cfg!(target_feature = "avx")`, at compile time,
# so the x86_64 baseline below decides whether `quant="q8_0"` gets the AVX path at all.
# `x86-64-v3` is AVX2/FMA/F16C: Intel from 2013, AMD from 2015. Lower costs every quantized
# kernel; higher, or `native`, costs users with older machines. aarch64 needs no flag --
# NEON is baseline for ARMv8, so those kernels are in either way.
name: Python wheels

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    # Docs alone change no wheel. Tag pushes ignore path filters, so a release always builds.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

# Nine release builds of a crate this size is not something to run twice on the same branch.
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: '3.13'

jobs:
  linux:
    name: manylinux ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-22.04, target: x86_64, rustflags: -C target-cpu=x86-64-v3 }
          - { runner: ubuntu-22.04-arm, target: aarch64, rustflags: '' }
    steps:
      - uses: actions/checkout@v7
      - name: Remove the local cargo config
        run: rm -f .cargo/config.toml
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --strip --out dist --manifest-path ptts-pyo3/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
        env:
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
      - uses: ./.github/actions/test-wheel
      # The wheel says `cp39-abi3`, and everything above tests it on PYTHON_VERSION. Load it
      # on the floor it advertises too. One leg is enough to catch a limited-API slip, and
      # x86_64 is the one to pick: numpy 2.1 dropped 3.9, so this is also the only job that
      # resolves the older numpy a 3.9 user gets.
      - if: matrix.platform.target == 'x86_64'
        uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - if: matrix.platform.target == 'x86_64'
        uses: ./.github/actions/test-wheel
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-manylinux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    name: musllinux ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-22.04, target: x86_64, rustflags: -C target-cpu=x86-64-v3 }
          - { runner: ubuntu-22.04-arm, target: aarch64, rustflags: '' }
    steps:
      - uses: actions/checkout@v7
      - name: Remove the local cargo config
        run: rm -f .cargo/config.toml
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --strip --out dist --manifest-path ptts-pyo3/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
        env:
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
      # No test step: these are musl wheels and the runner is glibc, so there is no
      # interpreter here that can install one.
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    name: windows ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: windows-latest, target: x64, python_arch: x64, rustflags: -C target-cpu=x86-64-v3 }
          - { runner: windows-11-arm, target: aarch64, python_arch: arm64, rustflags: '' }
    steps:
      - uses: actions/checkout@v7
      - name: Remove the local cargo config
        shell: bash
        run: rm -f .cargo/config.toml
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          architecture: ${{ matrix.platform.python_arch }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --strip --out dist --manifest-path ptts-pyo3/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
      - uses: ./.github/actions/test-wheel
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    name: macos ${{ matrix.platform.target }}
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: macos-14, target: aarch64, rustflags: -C target-cpu=apple-m1, features: 'accelerate,kai,metal' }
          # `-avx,-avx2` is what `.cargo/config.toml` sets for this target; see the note in
          # CLAUDE.md about benchmarking macOS x86_64.
          - { runner: macos-15-intel, target: x86_64, rustflags: -C target-feature=-avx,-avx2, features: 'accelerate' }
    steps:
      - uses: actions/checkout@v7
      - name: Remove the local cargo config
        run: rm -f .cargo/config.toml
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build wheel
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --strip --out dist --manifest-path ptts-pyo3/Cargo.toml --features ${{ matrix.platform.features }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          RUSTFLAGS: ${{ matrix.platform.rustflags }}
      # xn's build script prints `cargo:rustc-cfg=xn_kai` only when the KleidiAI kernels compiled.
      # A toolchain too old for them turns the feature off with a warning, which cargo hides for a
      # crates.io dependency, so check the recorded output of the build that ships instead.
      - name: Check that the KleidiAI kernels are in the build
        if: contains(matrix.platform.features, 'kai')
        shell: bash
        run: |
          set -euo pipefail
          outputs=$(find target -path '*/release/build/xn-*/output')
          if [ -z "$outputs" ] || ! grep -qs "cargo:rustc-cfg=xn_kai" $outputs; then
            echo "::error::the KleidiAI kernels did not build with this toolchain"
            exit 1
          fi
      - uses: ./.github/actions/test-wheel
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    name: sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Remove the local cargo config
        run: rm -f .cargo/config.toml
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path ptts-pyo3/Cargo.toml
      - name: Build it from source, and test what comes out
        # The sdist is what anyone on a platform we ship no wheel for actually installs --
        # free-threaded CPython and PyPy, since the wheels are abi3 -- and to compile at all
        # it has to carry a workspace that `ptts-wasm` and `ptts-ws-server` are not in.
        # Nothing but building it finds that out, so this does, on every run. No RUSTFLAGS:
        # a source build should be tested the way someone will actually get it. This leg builds
        # on PYTHON_VERSION; `sdist-fallback` is what covers the interpreters named above.
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz pytest
          python -m pip check
          cd ptts-pyo3 && python -m pytest -m "not checkpoint" -q
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  sdist-fallback:
    name: sdist on ${{ matrix.python }}
    runs-on: ubuntu-latest
    needs: sdist
    # The interpreters an abi3 wheel cannot serve, so the sdist is all they get. Deliberately
    # not in `release`'s `needs`: a break here means those users compile and fail, and holding
    # back everyone else's wheels does nothing to fix that. This is here to be seen, not to gate.
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14t', 'pypy3.11']
    steps:
      - uses: actions/checkout@v7
      - name: Remove the local cargo config
        run: rm -f .cargo/config.toml
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v8
        with:
          name: wheels-sdist
          path: dist
      - name: Compile the sdist and test what comes out
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.tar.gz pytest
          # Not on PyPy: it ships `cffi` without `pycparser` as an installed distribution, so
          # `pip check` reports a break in the interpreter's own preinstalled packages and
          # never reaches ours. It proves little on this path anyway, which resolves its
          # dependencies from the index rather than with `--no-deps`.
          [ "${{ matrix.python }}" = 'pypy3.11' ] || python -m pip check
          cd ptts-pyo3 && python -m pytest -m "not checkpoint" -q

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Check the tag matches the workspace version
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import os, pathlib, tomllib
          version = tomllib.loads(pathlib.Path("Cargo.toml").read_text())["workspace"]["package"]["version"]
          if os.environ["TAG"] != f"v{version}":
              raise SystemExit(f"Tag {os.environ['TAG']} does not match workspace version {version}")
          PYTHON
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Consolidate wheels
        run: mkdir -p dist && cp wheels-*/* dist/
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          # PEP 740 attestations are signed via Sigstore's Rekor log, which is
          # flaky ("Response ended prematurely") and blocks publishing. Build
          # provenance is already attested by the attest-build-provenance step.
          attestations: false
