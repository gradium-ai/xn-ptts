# This file is autogenerated by maturin v1.8.2
# To update, run
#
#    maturin generate-ci github -m ptts-pyo3/Cargo.toml
#
# Two things are hand-added and a regeneration would drop them: the `test-wheel` step, which
# installs the wheel a job just built and runs pytest against it; and every job deleting
# `.cargo/config.toml` and sets `RUSTFLAGS` itself. That file pins `target-cpu=native`, which
# in a published wheel means "whatever CPU the runner happened to have" -- a wheel that can
# fault with SIGILL on someone's older machine.
#
# `xn` picks its quantized SIMD kernels with `cfg!(target_feature = "avx")`, at compile time,
# so the x86_64 baseline decides whether `quant="q8_0"` gets the AVX path at all. `x86-64-v3`
# is AVX2/FMA/F16C: Intel from 2013, AMD from 2015. Lower costs every quantized kernel;
# higher, or `native`, costs users with older machines. aarch64 needs no flag -- NEON is
# baseline for ARMv8, so those kernels are in either way.
name: CI

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Remove the local cargo config
        shell: bash
        run: rm -f .cargo/config.toml
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter --manifest-path ptts-pyo3/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: auto
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
      - uses: ./.github/actions/test-wheel
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  musllinux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-22.04
            target: x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Remove the local cargo config
        shell: bash
        run: rm -f .cargo/config.toml
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter --manifest-path ptts-pyo3/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: musllinux_1_2
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
      # No test step: these are musl wheels and the runner is glibc, so there is no
      # interpreter here that can install one.
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-musllinux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
    steps:
      - uses: actions/checkout@v7
      - name: Remove the local cargo config
        shell: bash
        run: rm -f .cargo/config.toml
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
          architecture: ${{ matrix.platform.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter --manifest-path ptts-pyo3/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          RUSTFLAGS: -C target-cpu=x86-64-v3
      - uses: ./.github/actions/test-wheel
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-14
            target: aarch64
    steps:
      - uses: actions/checkout@v7
      - name: Remove the local cargo config
        shell: bash
        run: rm -f .cargo/config.toml
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter --manifest-path ptts-pyo3/Cargo.toml
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
        env:
          RUSTFLAGS: "-C target-cpu=apple-m1"
      - uses: ./.github/actions/test-wheel
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist --manifest-path ptts-pyo3/Cargo.toml
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
    needs: [linux, musllinux, windows, macos, sdist]
    permissions:
      # Use to sign the release artifacts
      id-token: write
      # Used to upload release artifacts
      contents: write
      # Used to generate artifact attestation
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'wheels-*/*'
      - name: Consolidate wheels
        run: mkdir -p dist && cp wheels-*/* dist/
      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          skip-existing: true
          # PEP 740 attestations are signed via Sigstore's Rekor log, which is
          # flaky ("Response ended prematurely") and blocks publishing. Build
          # provenance is already attested by the attest-build-provenance step.
          attestations: false
