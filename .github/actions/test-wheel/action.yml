name: Test wheel
description: Install the wheel that was just built and run the Python test suite against it.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        python -m pip install --upgrade pip
        # Let pip choose the wheel, rather than globbing `dist/*.whl`: `--find-interpreter`
        # builds one wheel per interpreter it finds in the manylinux image, and handing pip
        # a cp310 wheel on a 3.14 runner is an error, not a skip. `--no-index` keeps it to
        # what this job built, and `--no-deps` is what lets `--no-index` work at all -- pip
        # cannot resolve `numpy` from an index it has been told not to use.
        python -m pip install --find-links dist --no-index --no-deps ptts
        # The dependencies that `--no-deps` just skipped, and the test runner.
        python -m pip install pytest numpy
        # `numpy` is spelled out above, so this is what notices if `ptts` gains a second
        # dependency: without it a missing one would only surface as an ImportError in a
        # test that happens to touch it.
        python -m pip check
        # From the crate directory, so pytest reads the `testpaths` and `markers` in its
        # own pyproject.toml. `ptts` imports from site-packages either way -- `python/` is
        # not on the path, so this tests the wheel and not the source tree.
        cd ptts-pyo3 && python -m pytest -m "not checkpoint" -q
