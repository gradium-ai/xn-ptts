<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pocket TTS on WebGPU</title>
<style>
  :root {
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2230; --line:#2a3140;
    --fg:#e6edf3; --dim:#8b949e; --accent:#4493f8; --good:#3fb950; --warn:#d29922; --bad:#f85149;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:system-ui,-apple-system,sans-serif; background:var(--bg); color:var(--fg);
         max-width:1000px; margin:0 auto; padding:32px 20px 64px; line-height:1.5; }
  h1 { font-size:22px; font-weight:650; }
  h2 { font-size:13px; font-weight:650; text-transform:uppercase; letter-spacing:.06em;
       color:var(--dim); margin-bottom:10px; }
  code { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  header { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
  .badge { font-size:12px; padding:3px 9px; border-radius:999px; background:var(--panel2);
           border:1px solid var(--line); }
  .badge.ok { border-color:#1f6f3c; color:var(--good); }
  .badge.bad { border-color:#6e2620; color:var(--bad); }
  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px;
           padding:18px; margin-bottom:18px; }
  label { display:block; font-size:12px; font-weight:600; color:var(--dim); margin-bottom:5px; }
  textarea, select, input { font-family:inherit; font-size:14px; color:var(--fg);
    background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:8px 10px; width:100%; }
  textarea { resize:vertical; }
  .row { display:flex; gap:14px; flex-wrap:wrap; align-items:flex-end; margin-top:14px; }
  .row > div { flex:0 0 auto; }
  .grow { flex:1 1 150px; }
  button { font-family:inherit; font-size:14px; font-weight:600; padding:9px 20px; border:none;
           border-radius:6px; background:var(--accent); color:#06101d; cursor:pointer; }
  button.ghost { background:var(--panel2); color:var(--fg); border:1px solid var(--line); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #status { margin-top:14px; font-size:13px; color:var(--dim); white-space:pre-wrap; }
  #status.err { color:var(--bad); }
  .bar { height:6px; background:var(--panel2); border-radius:3px; overflow:hidden; margin-top:8px; }
  .bar > div { height:100%; background:var(--accent); width:0; transition:width .1s; }
  .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; }
  .card { background:var(--panel2); border:1px solid var(--line); border-radius:8px; padding:12px 14px; }
  .card .k { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); }
  .card .v { font-size:22px; font-weight:650; margin-top:3px;
             font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  .card .u { font-size:12px; color:var(--dim); font-weight:400; }
  .rtf-good{color:var(--good)} .rtf-warn{color:var(--warn)} .rtf-bad{color:var(--bad)}
  canvas { width:100%; height:90px; display:block; background:var(--bg);
           border:1px solid var(--line); border-radius:8px; margin-top:14px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { text-align:right; padding:7px 9px; border-bottom:1px solid var(--line); }
  th:first-child,td:first-child { text-align:left; }
  th { font-size:11px; text-transform:uppercase; letter-spacing:.05em; color:var(--dim); font-weight:600; }
  td { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
  td.txt { font-family:inherit; }
  .empty { color:var(--dim); font-size:13px; }
</style>
</head>
<body>

<header>
  <h1>Pocket TTS on WebGPU</h1>
  <span class="badge" id="gpu-badge">checking WebGPU…</span>
  <span class="badge" id="dev-badge" hidden></span>
  <span class="badge" id="threads-note" hidden></span>
  <span class="badge" id="build-badge" hidden></span>
</header>
<div class="panel">
  <div class="row" style="margin-top:0">
    <div class="grow">
      <label for="base">Weights</label>
      <select id="base">
        <option value="/model" selected>/model (served locally)</option>
        <option value="https://huggingface.co/kyutai/pocket-tts-without-voice-cloning/resolve/main">HuggingFace · kyutai/pocket-tts-without-voice-cloning</option>
      </select>
    </div>
    <div>
      <label for="dtype">dtype</label>
      <select id="dtype" style="width:150px">
        <option value="f32" selected>f32</option>
        <option value="f16">f16</option>
        <option value="q8">q8_0 / f32</option>
        <option value="q8f16">q8_0 / f16</option>
      </select>
    </div>
    <div><button id="load">Load model</button></div>
  </div>
  <div class="bar"><div id="prog"></div></div>
  <div id="status"></div>
</div>

<div class="panel">
  <label for="text">Text</label>
  <textarea id="text" rows="3">Hello, this is a test of the pocket text to speech system, running entirely in the browser on WebGPU.</textarea>
  <div class="row">
    <div class="grow"><label for="voice">Voice</label><select id="voice" disabled></select></div>
    <div><label for="seed">Seed</label><input id="seed" type="number" value="42" style="width:100px"></div>
    <div><label for="play">Playback</label><select id="play" style="width:130px">
      <option value="stream" selected>Stream live</option>
      <option value="end">After run</option>
      <option value="off">Off</option>
    </select></div>
    <div><button id="go" disabled>Generate</button></div>
    <div><button id="save" class="ghost" disabled>Download WAV</button></div>
  </div>
</div>

<div class="panel">
  <h2>Last run</h2>
  <div class="cards" id="cards"><p class="empty">No runs yet.</p></div>
  <canvas id="wave"></canvas>
</div>

<div class="panel">
  <h2>Run history</h2>
  <div id="history"><p class="empty">No runs yet.</p></div>
</div>

<script type="module">
const $ = id => document.getElementById(id);
let worker = null, info = null, runs = [], chunks = [], lastPcm = null, player = null, playMode = 'stream';
// Set by the auto block below; the worker error handler calls it if present.
let reportFailure = null;

const fmt = (v, d = 1) => (v == null || !isFinite(v)) ? 'n/a' : v.toFixed(d);
const rtfClass = r => r >= 1 ? 'rtf-good' : r >= 0.7 ? 'rtf-warn' : 'rtf-bad';
const setStatus = (m, err = false) => { $('status').textContent = m; $('status').className = err ? 'err' : ''; };

// ---- build stamp -------------------------------------------------------
// `pkg/` is assembled by copying files, so a rebuild mid-session can leave a tab
// holding a page and a wasm from different builds. That fails in ways that look
// like code bugs, so the page carries the stamp it loaded with and checks it.
let loadedBuild = null;

async function fetchBuild() {
  try {
    const r = await fetch('/build.txt', { cache: 'no-store' });
    return r.ok ? (await r.text()).trim() : null;
  } catch (e) {
    return null;
  }
}

fetchBuild().then(b => {
  loadedBuild = b;
  if (b) {
    $('build-badge').textContent = b.split(' ')[0];
    $('build-badge').hidden = false;
  }
});

/// True if the server has been rebuilt since this tab loaded, so it is stale.
async function buildChanged() {
  if (!loadedBuild) return false;
  const now = await fetchBuild();
  return now !== null && now !== loadedBuild;
}

// ---- WebGPU presence, before anything expensive -------------------------
// `navigator.gpu` existing is not the same as there being an adapter: Android
// blocklists WebGPU on many GPU/driver pairs, and the API stays exposed while
// every requestAdapter returns null. Checked here so that fails in a second
// rather than after a 136 MB download.
if (!navigator.gpu) {
  $('gpu-badge').textContent = 'WebGPU unavailable';
  $('gpu-badge').className = 'badge bad';
  setStatus('No navigator.gpu — needs Chrome 113+, Edge, or Safari 18+.', true);
  $('load').disabled = true;
} else if (!(await navigator.gpu.requestAdapter().catch(() => null))) {
  $('gpu-badge').textContent = 'no WebGPU adapter';
  $('gpu-badge').className = 'badge bad';
  const android = /Android/i.test(navigator.userAgent);
  setStatus(
    'WebGPU is exposed but the browser offers no adapter, so nothing here can run.\n' +
    (android
      ? 'On Android this is nearly always the GPU or driver being blocklisted. Open chrome://gpu ' +
        'and read the WebGPU line for the reason, then try setting ' +
        'chrome://flags/#enable-unsafe-webgpu and chrome://flags/#enable-vulkan to Enabled and ' +
        'relaunching Chrome.'
      : 'Check the browser version (iOS/Safari 18+, Chrome 121+) and turn off low power mode.') +
    '\nOpen /diag.html for the full adapter probe.',
    true,
  );
  $('load').disabled = true;
} else {
  $('gpu-badge').textContent = 'WebGPU available';
  $('gpu-badge').className = 'badge ok';
}

// ---- audio -------------------------------------------------------------
let ctx = null;
function audioCtx() {
  if (!ctx) ctx = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: info.sample_rate });
  if (ctx.state === 'suspended') ctx.resume();
  return ctx;
}
class Player {
  constructor() { this.ac = audioCtx(); this.head = 0; this.startAt = null; }
  push(f32) {
    const b = this.ac.createBuffer(1, f32.length, info.sample_rate);
    b.copyToChannel(f32, 0);
    const s = this.ac.createBufferSource();
    s.buffer = b; s.connect(this.ac.destination);
    const floor = this.ac.currentTime + 0.2;
    if (this.head < floor) this.head = floor;
    if (this.startAt === null) this.startAt = this.head;
    s.start(this.head);
    this.head += b.duration;
  }
  /// Seconds of audio the listener has actually heard, from the audio clock.
  played() {
    if (this.startAt === null) return 0;
    return Math.max(0, this.ac.currentTime - this.startAt);
  }
}
function playAll(f32) {
  const ac = audioCtx();
  const b = ac.createBuffer(1, f32.length, info.sample_rate);
  b.copyToChannel(f32, 0);
  const s = ac.createBufferSource();
  s.buffer = b; s.connect(ac.destination); s.start();
  const startAt = ac.currentTime;
  return { played: () => Math.max(0, ac.currentTime - startAt) };
}
function wavBlob(f32, rate) {
  const buf = new ArrayBuffer(44 + f32.length * 2), dv = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) dv.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); dv.setUint32(4, 36 + f32.length * 2, true); str(8, 'WAVEfmt ');
  dv.setUint32(16, 16, true); dv.setUint16(20, 1, true); dv.setUint16(22, 1, true);
  dv.setUint32(24, rate, true); dv.setUint32(28, rate * 2, true);
  dv.setUint16(32, 2, true); dv.setUint16(34, 16, true);
  str(36, 'data'); dv.setUint32(40, f32.length * 2, true);
  for (let i = 0; i < f32.length; i++) {
    const s = Math.max(-1, Math.min(1, f32[i]));
    dv.setInt16(44 + i * 2, s * 32767, true);
  }
  return new Blob([buf], { type: 'audio/wav' });
}

// ---- waveform ----------------------------------------------------------
// The waveform tracks the *audio clock*, not frame arrival. Generation finishes
// several times faster than realtime -- ~1.2 s of compute for 7.5 s of speech --
// so filling the canvas as frames arrive completes it long before the listener
// has heard any of it, which reads as "it did not draw while streaming".
//
// So two layers: generated audio is drawn dim as it arrives, and the portion the
// listener has actually heard is drawn bright over it, advancing with playback.
// With playback off there is no clock to follow and everything is bright at once.
const DIM = '#27476b';
const BRIGHT = '#4493f8';
const HEAD = '#8b949e';

const wave = {
  g: null, w: 0, h: 0, mid: 0,
  buf: null,      // generated samples, contiguous
  len: 0,         // how many of them are valid
  axis: 0,        // samples the x-axis currently spans
  live: false,
  raf: 0,
  source: null,   // something with played() -> seconds, or null
  done: false,    // generation finished, so `len` is final
};

function waveCtx() {
  const c = $('wave'), dpr = devicePixelRatio || 1;
  c.width = c.clientWidth * dpr; c.height = c.clientHeight * dpr;
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  return { g, w: c.clientWidth, h: c.clientHeight, mid: c.clientHeight / 2 };
}

/// Min/max columns for `buf[0..len)` across `[0, w)`, where the x-axis spans
/// `axis` samples. Only columns below `upTo` samples are drawn.
function paint(g, buf, len, axis, upTo, w, mid, colour) {
  if (!len) return;
  g.fillStyle = colour;
  const perPx = Math.max(1, axis / w);
  const lastX = Math.min(w, Math.ceil(Math.min(len, upTo) / perPx));
  for (let x = 0; x < lastX; x++) {
    const from = Math.floor(x * perPx);
    const to = Math.min(len, Math.floor((x + 1) * perPx));
    let lo = 0, hi = 0;
    for (let i = from; i < to; i++) {
      if (buf[i] < lo) lo = buf[i];
      if (buf[i] > hi) hi = buf[i];
    }
    g.fillRect(x, mid + lo * mid, 1, Math.max(1, (hi - lo) * mid));
  }
}

function repaint() {
  const { g, w, h, mid } = wave;
  g.clearRect(0, 0, w, h);
  g.strokeStyle = '#2a3140'; g.beginPath(); g.moveTo(0, mid); g.lineTo(w, mid); g.stroke();
  if (!wave.len) return;
  const axis = wave.axis || wave.len;
  // Everything generated, dim; then the heard part over it, bright.
  paint(g, wave.buf, wave.len, axis, wave.len, w, mid, DIM);
  const heard = wave.source
    ? Math.round(wave.source.played() * info.sample_rate)
    : wave.len;
  paint(g, wave.buf, wave.len, axis, heard, w, mid, BRIGHT);
  if (wave.source && heard > 0 && heard < wave.len) {
    const x = Math.min(w - 1, Math.floor(heard / (axis / w)));
    g.fillStyle = HEAD;
    g.fillRect(x, 0, 1, h);
  }
}

/// Repaint on every animation frame, so the fill advances with the audio rather
/// than with whenever a message happens to arrive.
function waveLoop() {
  if (!wave.live) return;
  wave.loops = (wave.loops || 0) + 1;
  try { repaint(); wave.paints = (wave.paints || 0) + 1; }
  catch (e) { wave.err = String(e && e.message || e); }
  const heard = wave.source ? wave.source.played() * info.sample_rate : wave.len;
  if (wave.done && heard >= wave.len) { wave.live = false; wave.raf = 0; return; }
  wave.raf = requestAnimationFrame(waveLoop);
}

function beginWave(maxFrames, frameSize) {
  const { g, w, h, mid } = waveCtx();
  const cap = Math.max(1, maxFrames) * frameSize;
  Object.assign(wave, {
    g, w, h, mid, buf: new Float32Array(cap), len: 0, axis: cap,
    live: true, source: null, done: false,
  });
  if (wave.raf) cancelAnimationFrame(wave.raf);
  wave.raf = requestAnimationFrame(waveLoop);
}

function pushWave(f32) {
  if (!wave.buf || wave.len + f32.length > wave.buf.length) return;
  wave.buf.set(f32, wave.len);
  wave.len += f32.length;
}

/// Generation is over, so the true length is known: tighten the axis onto it and
/// let the loop keep filling until playback catches up.
function endWave(source) {
  wave.done = true;
  wave.axis = wave.len || 1;
  if (source) wave.source = source;
  if (!wave.live) { wave.live = true; wave.raf = requestAnimationFrame(waveLoop); }
}

/// Static draw of a finished buffer (resize when idle, or playback off).
function drawWave(f32) {
  wave.live = false;
  if (wave.raf) { cancelAnimationFrame(wave.raf); wave.raf = 0; }
  const { g, w, h, mid } = waveCtx();
  Object.assign(wave, { g, w, h, mid });
  g.clearRect(0, 0, w, h);
  g.strokeStyle = '#2a3140'; g.beginPath(); g.moveTo(0, mid); g.lineTo(w, mid); g.stroke();
  if (!f32 || !f32.length) return;
  paint(g, f32, f32.length, f32.length, f32.length, w, mid, BRIGHT);
}

// ---- rendering ---------------------------------------------------------
function pct(a, p) {
  if (!a || !a.length) return null;
  const v = [...a].sort((x, y) => x - y);
  return v[Math.min(v.length - 1, Math.max(0, Math.ceil(p / 100 * v.length) - 1))];
}
function renderCards(s) {
  const cards = [
    ['RTF', fmt(s.rtf, 2), '×', rtfClass(s.rtf)],
    ['TTFA', fmt(s.ttfa_ms), 'ms'],
    ['Total', fmt(s.total_ms), 'ms'],
    ['Audio', fmt(s.audio_ms), 'ms'],
    ['Conditioning', fmt(s.prompt_ms), 'ms'],
    ['Per-frame p50', fmt(pct(s.frame_ms, 50), 2), 'ms'],
    ['Per-frame p95', fmt(pct(s.frame_ms, 95), 2), 'ms'],
    ['Frames', s.frames, ''],
  ];
  $('cards').innerHTML = cards.map(([k, v, u, cls]) =>
    `<div class="card"><div class="k">${k}</div><div class="v ${cls || ''}">${v}` +
    (u ? ` <span class="u">${u}</span>` : '') + '</div></div>').join('');
}
function renderHistory() {
  if (!runs.length) { $('history').innerHTML = '<p class="empty">No runs yet.</p>'; return; }
  const rows = runs.map((s, i) => `<tr>
    <td class="txt">${runs.length - i}</td><td class="txt">${s.dtype}</td>
    <td class="${rtfClass(s.rtf)}">${fmt(s.rtf, 2)}</td>
    <td>${fmt(s.ttfa_ms)}</td><td>${fmt(s.total_ms)}</td><td>${fmt(s.audio_ms)}</td>
    <td>${fmt(pct(s.frame_ms, 50), 2)}</td><td>${fmt(pct(s.frame_ms, 95), 2)}</td>
    <td>${s.frames}</td></tr>`).join('');
  $('history').innerHTML = `<table><thead><tr><th>#</th><th>dtype</th><th>rtf</th>
    <th>ttfa ms</th><th>total ms</th><th>audio ms</th><th>frame p50</th><th>frame p95</th>
    <th>frames</th></tr></thead><tbody>${rows}</tbody></table>`;
}

// ---- worker wiring -----------------------------------------------------
const VOICES = ['alba', 'marius', 'javert', 'fantine', 'cosette', 'eponine', 'azelma'];

// The dtype dictates the container: q8 reads pre-quantized blocks, so it needs the
// gguf; f32/f16 need dense weights, so they need the safetensors. HuggingFace keeps
// the two in separate repos.
function weightsUrl(base, dtype) {
  const q8 = dtype.startsWith('q8');
  if (base === '/model') return q8 ? '/model/model.q8.gguf' : '/model/model.safetensors';
  if (q8) {
    return 'https://huggingface.co/lmz/pocket-tts-without-voice-cloning-q8/resolve/main/tts_b6369a24.gguf';
  }
  return `${base}/model.safetensors`;
}

function voiceList(base) {
  // The local dir keeps voices next to the model; the HF repo keeps them under
  // embeddings_v2/, which is also where its own demo reads them from.
  if (base === '/model') {
    return ['Archie','Damon','Elodie-Rose','Freddie','Freya','Garrett','Marlowe','Zoey']
      .map(n => ({ name: n, url: `/voices/${n}.safetensors` }));
  }
  return VOICES.map(n => ({ name: n, url: `${base}/embeddings_v2/${n}.safetensors` }));
}

$('load').onclick = async () => {
  if (await buildChanged()) {
    setStatus(
      'This tab was loaded from an older build than the server is now serving, so its page and ' +
      'wasm may disagree. Reload (Cmd-Shift-R) before loading a model.', true);
    return;
  }
  const base = $('base').value, dtype = $('dtype').value;
  $('load').disabled = true;
  runs = []; renderHistory();
  worker = new Worker('./worker.js', { type: 'module' });
  // A module worker that fails to load reports an ErrorEvent with an empty
  // message, so the location is the only useful part.
  worker.onerror = e => {
    const where = e.filename ? ` at ${e.filename}:${e.lineno}:${e.colno}` : '';
    const msg = `worker failed: ${e.message || '(no message)'}${where}`;
    setStatus(msg, true);
    $('load').disabled = false;
    if (typeof reportFailure === 'function') reportFailure(msg);
  };
  worker.onmessageerror = e => setStatus('worker message error: ' + JSON.stringify(e.data), true);
  worker.onmessage = ev => {
    const m = ev.data;
    switch (m.type) {
      case 'status': setStatus(m.message); break;
      case 'warn': console.warn(m.message); break;
      case 'progress': {
        const p = m.total ? (m.received / m.total * 100) : 0;
        $('prog').style.width = p + '%';
        setStatus(`${m.label}: ${(m.received / 1e6).toFixed(1)} MB` +
          (m.total ? ` / ${(m.total / 1e6).toFixed(1)} MB` : ''));
        break;
      }
      case 'threads':
        // Not a setting: this build has no `atomics`, so it is one thread, and the
        // WebGPU backend has no rayon call that would read a count anyway.
        $('threads-note').textContent = `${m.threads} thread · ${m.cpus} cpu`;
        $('threads-note').hidden = false;
        break;
      case 'device':
        $('dev-badge').textContent = m.device + (m.f16 ? ' · shader-f16' : ' · no shader-f16');
        $('dev-badge').hidden = false;
        break;
      case 'voice': {
        const o = document.createElement('option');
        o.value = m.name; o.textContent = m.name;
        $('voice').appendChild(o);
        $('voice').disabled = false;
        break;
      }
      case 'weights':
        console.log(`weights: ${m.bytes} bytes, magic ${JSON.stringify(m.magic)}, from ${m.url}`);
        break;
      case 'ready':
        info = m.info;
        // Re-enabled so a different dtype can be loaded without reloading the
        // page; each Load spawns a fresh worker, so the old model goes away.
        $('load').disabled = false;
        $('prog').style.width = '100%';
        setStatus(`${info.device} · ${info.dtype} · ${info.container} · ` +
          `${info.sample_rate} Hz · loaded ${fmt(info.load_ms)} ms`);
        $('go').disabled = false;
        break;
      case 'gen_start':
        chunks = [];
        playMode = $('play').value;
        player = playMode === 'stream' ? new Player() : null;
        beginWave(m.maxFrames, info.frame_size);
        // Streaming playback is the clock straight away; "after run" gets one at
        // gen_done; with playback off there is none and the fill is immediate.
        if (player) wave.source = player;
        setStatus(`generating · ${m.tokens} tokens`);
        break;
      case 'frame': {
        const f = new Float32Array(m.pcm);
        chunks.push(f);
        if (player) player.push(f);
        pushWave(f);
        break;
      }
      case 'gen_done': {
        const s = m.stats;
        runs.unshift(s);
        const total = chunks.reduce((n, c) => n + c.length, 0);
        const all = new Float32Array(total);
        let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
        lastPcm = all;
        $('save').disabled = !all.length;
        renderCards(s); renderHistory();
        // Not drawWave: that would finish the waveform instantly, which is the
        // thing this is meant to avoid. Hand the loop the true length and, for
        // "after run", the clock it should follow.
        endWave(playMode === 'end' ? playAll(all) : null);
        if (playMode === 'off') drawWave(all);
        setStatus(`done · ${fmt(s.rtf, 2)}× realtime · ${s.dtype}`);
        $('go').disabled = false;
        break;
      }
      case 'error':
        setStatus(m.message, true);
        $('go').disabled = false;
        $('load').disabled = false;
        // In auto mode nothing else will ever fire, so report now rather than
        // sitting until the guard timeout.
        if (typeof reportFailure === 'function') reportFailure(m.message);
        break;
    }
  };
  worker.postMessage({
    type: 'setup', base, dtype, temperature: 0.4,
    weightsUrl: weightsUrl(base, dtype),
    configUrl: base === '/model' ? '/model/config.json' : null,
    voices: voiceList(base),
  });
};

$('go').onclick = () => {
  const text = $('text').value.trim();
  if (!text) return setStatus('nothing to say', true);
  $('go').disabled = true;
  worker.postMessage({
    type: 'generate', text, voice: $('voice').value,
    seed: parseInt($('seed').value, 10) || 42,
  });
};

$('save').onclick = () => {
  if (!lastPcm) return;
  const a = document.createElement('a');
  a.href = URL.createObjectURL(wavBlob(lastPcm, info.sample_rate));
  a.download = 'ptts-webgpu.wav';
  a.click();
  URL.revokeObjectURL(a.href);
};

addEventListener('resize', () => {
  // The live loop repaints from `wave.buf` every frame, so it only needs the new
  // canvas geometry; a finished waveform has to be redrawn here.
  if (wave.live) {
    const { g, w, h, mid } = waveCtx();
    Object.assign(wave, { g, w, h, mid });
  } else {
    drawWave(lastPcm);
  }
});

// ---- headless mode -----------------------------------------------------
// `?auto=1&dtype=f16&iters=3` loads, generates, and POSTs the result to
// /report, so the same page doubles as a check runnable from a shell.
const q = new URLSearchParams(location.search);
if (q.get('auto')) {
  // The page script is a module, so nothing in it is reachable from
  // `Runtime.evaluate`. Publish exactly what the screenshot harness needs.
  window.__probe = () => ({
    st: $('status').textContent.slice(0, 24),
    heard: wave.source ? wave.source.played() : null,
    len: wave.len, live: wave.live, done: wave.done,
    playMode: $('play').value, hasSource: !!wave.source,
    loops: wave.loops || 0, paints: wave.paints || 0, err: wave.err || null,
    ...(() => {
      const c = $('wave');
      if (!c.width) return { bright: -1, dim: -1 };
      const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
      let bright = 0, dim = 0;
      for (let i = 0; i < d.length; i += 4) {
        if (d[i] === 0x44 && d[i + 1] === 0x93 && d[i + 2] === 0xf8) bright++;
        else if (d[i] === 0x27 && d[i + 1] === 0x47 && d[i + 2] === 0x6b) dim++;
      }
      return { bright, dim };
    })(),
  });
  const report = obj => fetch('/report', {
    method: 'POST', headers: { 'content-type': 'application/json' },
    body: JSON.stringify(obj, null, 2),
  });
  const iters = parseInt(q.get('iters') || '1', 10);
  const checkpoints = [];
  let done = 0;
  let guard = 0;

  if (q.get('dtype')) $('dtype').value = q.get('dtype');
  if (q.get('base')) $('base').value = q.get('base');
  if (q.get('text')) $('text').value = q.get('text');
  $('play').value = q.get('play') || 'off';

  // A failure anywhere must still produce a report, or a headless run just hangs.
  const fail = msg => report({ error: msg, checkpoints });
  reportFailure = msg => { clearTimeout(guard); fail(msg); };
  addEventListener('error', e => fail('page error: ' + e.message));
  addEventListener('unhandledrejection', e => fail('unhandled rejection: ' + e.reason));
  guard = setTimeout(() => fail('timed out after 900s; checkpoints: ' + checkpoints.join(' > ')), 900000);

  if (!navigator.gpu) {
    clearTimeout(guard);
    fail('navigator.gpu is undefined in this browser');
  } else {
    const origStatus = setStatus;
    // Record progress so a hang says where it stopped.
    const mark = m => {
      if (m.startsWith('weights:') || m.startsWith('tokenizer:') || m.startsWith('voice ')) return;
      checkpoints.push(m);
      // Beaconed as it happens, so a stall is visible live rather than only in
      // the final report -- which a stall means never arrives.
      fetch('/progress', { method: 'POST', body: `${Math.round(performance.now())}ms ${m}` })
        .catch(() => {});
    };
    const obs = new MutationObserver(() => mark($('status').textContent));
    obs.observe($('status'), { childList: true, characterData: true, subtree: true });

    // Looped rather than spread: these arrays are 100k+ samples and
    // `Math.max(...arr)` overflows the call stack well before that.
    const audioOf = () => {
      const a = lastPcm;
      if (!a || !a.length) return { samples: 0, rms: 0, peak: 0, nonfinite: 0 };
      let sum = 0, peak = 0, nonfinite = 0;
      for (let i = 0; i < a.length; i++) {
        const v = a[i];
        if (!isFinite(v)) { nonfinite++; continue; }
        sum += v * v;
        const m = Math.abs(v);
        if (m > peak) peak = m;
      }
      return { samples: a.length, rms: Math.sqrt(sum / a.length), peak, nonfinite };
    };

    // Proof that the waveform fills in during the run rather than at the end:
    // sample the count of accent-coloured pixels while frames are arriving.
    const inkSeries = [];
    const inkCount = () => {
      const c = $('wave');
      if (!c.width || !c.height) return 0;
      const d = c.getContext('2d').getImageData(0, 0, c.width, c.height).data;
      let n = 0;
      for (let i = 0; i < d.length; i += 4) {
        // #4493f8, the waveform colour; the centre rule is #2a3140.
        if (d[i] === 0x44 && d[i + 1] === 0x93 && d[i + 2] === 0xf8) n++;
      }
      return n;
    };
    setInterval(() => { if (wave.live) inkSeries.push(inkCount()); }, 150);

    const origGo = $('go').onclick;
    const step = () => {
      done++;
      if (done <= iters) { origGo(); }
      else {
        clearTimeout(guard);
        report({
          ok: true, device: $('dev-badge').textContent, info, runs,
          audio: audioOf(), threadsNote: $('threads-note').textContent.trim().slice(0, 140),
          // Non-zero entries here mean the waveform was drawn mid-run.
          inkDuringRun: inkSeries.filter(v => v > 0).length,
          inkSamples: inkSeries.length, inkSeries: inkSeries.slice(0, 12),
          checkpoints,
        });
      }
    };
    // Chain: ready -> generate xN -> report.
    const hookReady = setInterval(() => {
      if (!$('go').disabled && info && done === 0) { clearInterval(hookReady); step(); }
    }, 200);
    const hookDone = setInterval(() => {
      if (info && done > 0 && done <= iters && !$('go').disabled && runs.length === done) { step(); }
    }, 200);
  }
  $('load').onclick();
}
</script>
</body>
</html>
