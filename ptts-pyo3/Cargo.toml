[package]
name = "ptts-pyo3"
version.workspace = true
edition = "2024"
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[lib]
# The package is `ptts`; this is the extension inside it, re-exported by
# `python/ptts/__init__.py`. A pure-Rust layout has nowhere to put `py.typed`.
name = "_ptts"
crate-type = ["cdylib"]

[dependencies]
xn = { workspace = true }
ptts = { workspace = true, features = ["hf"] }
hf-hub = { workspace = true }
numpy = "0.28"
# `abi3-py39`: one wheel per platform for every CPython from 3.9 on, rather than one
# per interpreter. This crate takes minutes to compile, so the alternative is a release
# matrix of platforms times interpreters -- and a new CPython release needing a rebuild
# before anyone on it can install at all.
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py39"] }
serde_json = { workspace = true }

[features]
default = []
cuda = ["xn/cuda", "ptts/cuda"]
vulkan = ["xn/vulkan", "ptts/vulkan"]
metal = ["xn/metal", "ptts/metal"]
webgpu = ["xn/webgpu", "ptts/webgpu"]
accelerate = ["xn/accelerate", "ptts/accelerate"]
