[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "ptts"
description = "Text to 24 kHz speech, on device. No PyTorch."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT OR Apache-2.0"
license-files = ["LICENSE-MIT", "LICENSE-APACHE"]
authors = [{ name = "Laurent Mazare" }, { name = "Gradium" }]
keywords = ["tts", "text-to-speech", "speech-synthesis", "voice-cloning", "on-device"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = ["numpy"]
dynamic = ["version"]

[project.scripts]
ptts = "ptts.__main__:main"

[project.urls]
Homepage = "https://github.com/gradium-ai/xn-ptts"
Repository = "https://github.com/gradium-ai/xn-ptts"
Issues = "https://github.com/gradium-ai/xn-ptts/issues"
"Model card" = "https://huggingface.co/kyutai/pocket-tts"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.maturin]
# No `features` key on purpose. A `--features` on the maturin command line *replaces* this
# list rather than adding to it, so the macOS wheel job's `--features accelerate` was quietly
# dropping `pyo3/extension-module`. It is a non-optional feature of the `pyo3` dependency in
# Cargo.toml instead, where nothing on a command line can take it away.
# A mixed layout: `python/ptts/` is the package, and the Rust cdylib lands inside it as
# `ptts._ptts`. A pure-Rust layout would have nowhere to put `py.typed` or `__main__.py`.
python-source = "python"
module-name = "ptts._ptts"
# sdist only: a source build should be testable, but the tests have no business in the wheel.
include = [{ path = "tests/**/*.py", format = "sdist" }]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "checkpoint: needs model weights; deselect with -m 'not checkpoint'",
]
