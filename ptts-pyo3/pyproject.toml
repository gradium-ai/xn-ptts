[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "ptts"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = ["numpy"]
dynamic = ["version"]

[tool.maturin]
# No `features` key on purpose. A `--features` on the maturin command line *replaces* this
# list rather than adding to it, so the macOS wheel job's `--features accelerate` was quietly
# dropping `pyo3/extension-module`. It is a non-optional feature of the `pyo3` dependency in
# Cargo.toml instead, where nothing on a command line can take it away.
