[package]
name = "ptts-openai-server"
version.workspace = true
edition = "2024"
publish = false
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true }
clap = { workspace = true, features = ["env"] }
futures-util = { workspace = true }
kaudio = { workspace = true }
ptts = { workspace = true, features = ["hf", "hub"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "net"] }
tower-http = { workspace = true, features = ["validate-request"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
xn = { workspace = true }

[features]
default = []
cuda = ["xn/cuda", "ptts/cuda"]
vulkan = ["xn/vulkan", "ptts/vulkan"]
metal = ["xn/metal", "ptts/metal"]
webgpu = ["xn/webgpu", "ptts/webgpu"]
accelerate = ["xn/accelerate", "ptts/accelerate"]
kai = ["xn/kai", "ptts/kai"]
