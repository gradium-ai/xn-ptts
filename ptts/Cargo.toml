[package]
name = "ptts"
version.workspace = true
edition = "2024"
autoexamples = false
description.workspace = true
repository.workspace = true
keywords.workspace = true
categories.workspace = true
license.workspace = true

[dependencies]
xn = { workspace = true }
ebur128 = { workspace = true }
rand = { workspace = true, features = ["std_rng"] }
rand_distr = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rubato = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }
tokenizers = { workspace = true, optional = true }
safetensors = { workspace = true }
thiserror = { workspace = true }
half = { workspace = true, optional = true }

[dev-dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
half = { workspace = true }
hf-hub = { workspace = true }
tracing-chrome = { workspace = true }

[target.'cfg(unix)'.dev-dependencies]
libc = { workspace = true }

# docs.rs builds with default features unless told otherwise, which would render the crate
# without `tok` or `audio` and with no implementation of the `Tokenizer` trait in sight. Not
# `all-features`: that turns on `cuda`, whose build script needs `nvcc`. The `docs` CI job
# builds this same set, so a docs.rs failure shows up on the PR instead of after publishing.
[package.metadata.docs.rs]
features = ["sp", "hf", "audio"]
rustdoc-args = ["--cfg", "docsrs"]

[features]
default = []
cuda = ["xn/cuda", "dep:half"]
vulkan = ["xn/vulkan"]
metal = ["xn/metal", "dep:half"]
webgpu = ["xn/webgpu"]
accelerate = ["xn/accelerate"]
# Hugging Face `tokenizers` support in `ptts::tok`.
hf = ["dep:tokenizers"]
# Decoding and resampling audio files (`ptts::audio`), for voice cloning.
audio = ["dep:symphonia", "dep:rubato"]

[[example]]
name = "say"
required-features = ["hf"]

[[example]]
name = "pocket_tts"
required-features = ["hf", "audio"]

[[example]]
name = "bench"
required-features = ["hf"]

[[example]]
name = "quantize"

[[example]]
name = "create_voice"
required-features = ["audio"]
