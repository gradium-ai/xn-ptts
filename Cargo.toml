[workspace]
members = [
  "ptts",
  "ptts-pyo3",
  "ptts-wasm",
  "ptts-ws-server",
]
resolver = "3"

[workspace.package]
version = "0.2.2"
description = "Pocket TTS inference and serving using xn"
repository = "https://github.com/LaurentMazare/xn-ptts"
keywords = ["pytorch", "deep-learning", "machine-learning"]
categories = ["science"]
license = "MIT/Apache-2.0"

[workspace.dependencies]
ptts = { path = "ptts", version = "0.2.2" }

anyhow = "1"
axum = { version = "0.8", default-features = false, features = ["ws", "tokio", "http1", "macros"] }
base64 = "0.22"
bytemuck = "1"
byteorder = "1.5.0"
clap = { version = "4", features = ["derive"] }
ebur128 = "0.1"
futures-util = "0.3"
getrandom = "0.3"
half = { version = "2.7.1", features = ["num-traits"] }
hf-hub = { version = "0.5", default-features = false, features = ["ureq"] }
js-sys = "0.3"
kaudio = "0.3.0"
libc = "0.2"
rand = { version = "0.9.0", default-features = false }
rand_distr = "0.5.0"
rubato = "0.15.0"
safetensors = "0.7.0"
sentencepiece = "0.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5.3", features = ["all"] }
tokenizers = "0.23.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6", features = ["trace"] }
tracing = "0.1.44"
tracing-chrome = "0.7.2"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
wasm-bindgen = "0.2"
xn = "0.2"

[profile.release]
debug = true

[profile.release-no-debug]
inherits = "release"
debug = false

# Local integration build: xn = upstream/main + davencyw perf/xn-threadpool-upstream +
# davencyw perf/q8-repack-layout (branch `integration/threadpool-q8repack`), gemm = gradium-ai
# main. Both live in git worktrees so the primary xn/ and gemm/ checkouts stay untouched.
# Drop this section to go back to the published crates.
[patch.crates-io]
# xn: perf/threadpool-repack-and-elemwise-tuning -- upstream/main + perf/xn-threadpool-upstream
# + perf/q8-repack-layout, plus the two commits that combination was missing. Measured 14.8x
# RTF here, matching perf/q8-neon-quantize, on a clean upstream base.
xn = { path = "../xn-perf/xn-core" }
# gemm: gradium-ai main. Measured no-op for this workload (hot path is xn's own NEON q8
# kernels, not gemm) but kept because it was explicitly requested.
gemm = { path = "../gemm-integration/gemm" }
